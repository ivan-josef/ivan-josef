name: Atualizar cartoes do perfil

on:
  push:
    branches: [main]
    paths: ['.github/workflows/github-stats.yml']
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: write

concurrency:
  group: github-profile-stats
  cancel-in-progress: false

jobs:
  atualizar:
    name: Gerar e publicar os dois cartoes
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Baixar o repositorio do perfil
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Gerar o cartao de estatisticas
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=ivan-josef&show_icons=true&theme=tokyonight&locale=pt-br
          path: profile/stats.svg
          token: ${{ secrets.STATS_TOKEN }}
          fail_on_error: true

      - name: Gerar o cartao de linguagens
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=ivan-josef&layout=compact&langs_count=8&theme=tokyonight&locale=pt-br&custom_title=Tecnologias
          path: profile/top-langs.svg
          token: ${{ secrets.STATS_TOKEN }}
          fail_on_error: true

      - name: Salvar os cartoes no repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/stats.svg profile/top-langs.svg

          if git diff --cached --quiet; then
            exit 0
          fi

          git commit -m "Atualizar estatisticas do GitHub"
          git pull --rebase origin main
          git push origin HEAD:main
